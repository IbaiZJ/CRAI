# ============================================
# CONFIGURACIÓN DEL SISTEMA DE RECONOCIMIENTO
# DE VEHÍCULOS Y MATRÍCULAS
# ============================================

# Configuración de cámara
camera:
  source: 1                    # Índice de la cámara (0=webcam, 1=USB)
  resolution:
    width: 1280
    height: 720
  fps: 30
  use_threading: true          # Usar VideoStream con threading

# Configuración del detector de vehículos
vehicle_detector:
  model_path: "models/yolov8n.pt"     # Modelo YOLO para vehículos
  confidence_threshold: 0.5    # Umbral de confianza mínimo
  classes:                     # Clases de vehículos a detectar
    - car
    - truck
    - bus
    - motorcycle
  
# Configuración del detector de matrículas
plate_detector:
  model_path: "models/license_plate_detector.pt"  # Modelo YOLO para matrículas
  confidence_threshold: 0.3    # Umbral de confianza mínimo
  min_plate_width: 40          # Ancho mínimo de matrícula en píxeles
  min_plate_height: 20         # Alto mínimo de matrícula en píxeles
  detect_in_vehicles_only: true  # Solo buscar matrículas dentro de vehículos

# Configuración del OCR
ocr:
  enabled: true
  engine: "easyocr"            # easyocr, tesseract, paddleocr
  languages: ["en"]            # Idiomas para reconocimiento
  use_gpu: false               # Usar GPU si está disponible
  confidence_threshold: 0.3    # Umbral mínimo para guardar resultado
  min_text_length: 4           # Longitud mínima de texto
  ocr_frequency: 15            # Ejecutar OCR cada N frames
  
  # Preprocesamiento de imagen
  preprocessing:
    resize_height: 100         # Redimensionar a esta altura mínima
    resize_width: 200          # Redimensionar a este ancho mínimo
    apply_clahe: true          # Mejorar contraste
    denoise: true              # Reducir ruido
  
  # Limpieza de texto
  text_cleaning:
    remove_spaces: true
    uppercase: true
    allowed_chars: "BCDFGHJKLMNPRSTVWXYZ0123456789"
    apply_corrections: true    # Corregir errores comunes (O->0, I->1, etc.)

# Configuración de visualización
display:
  window_name: "CRAI - Car Registration AI"
  show_fps: true
  show_stats: true
  
  # Colores (BGR)
  colors:
    vehicle_box: [0, 255, 0]      # Verde
    plate_box: [0, 255, 255]      # Amarillo
    text_high_conf: [255, 255, 255]  # Blanco (conf >= 60%)
    text_med_conf: [0, 255, 255]     # Amarillo (conf 30-60%)
    text_low_conf: [0, 165, 255]     # Naranja (conf < 30%)
  
  # Tamaños de fuente
  font:
    vehicle_label: 0.6
    plate_label: 0.6
    stats: 0.6


# Configuración de rendimiento
performance:
  skip_frames: 0               # Procesar 1 de cada N frames (0=todos)
  max_fps: 30                  # FPS máximo
  resize_frame:
    enabled: false
    width: 640
    height: 480

# Configuración de debug
debug:
  enabled: false
  save_debug_images: false
  debug_output_dir: "debug_plates"
  print_timings: false         # Imprimir tiempo de cada operación
  verbose_ocr: false

# Configuración de logging
logging:
  enabled: true
  level: "INFO"                # DEBUG, INFO, WARNING, ERROR, CRITICAL
  log_to_file: true
  log_to_console: true
  log_dir: "logs"
  max_file_size: 10485760      # 10 MB en bytes
  backup_count: 5              # Número de archivos de respaldo
  
  # Niveles por módulo
  modules:
    Config: "INFO"
    VehicleDetector: "INFO"
    PlateDetector: "INFO"
    PlateReader: "INFO"
    VideoStream: "INFO"
    main: "INFO"

# Configuración de alertas
alerts:
  enabled: false
  
  # Notificaciones
  notifications:
    email: false
    webhook: false
    webhook_url: ""
  
  # Condiciones de alerta
  conditions:
    min_confidence: 0.7        # Alertar solo si confianza >= 70%
    blacklist: []              # Lista de matrículas en lista negra
    whitelist: []              # Lista de matrículas permitidas

# Configuración de tracking
tracking:
  enabled: false
  max_disappeared: 50          # Frames antes de considerar objeto perdido
  max_distance: 50             # Distancia máxima para tracking (píxeles)