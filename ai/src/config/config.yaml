camera:
  source: 1
  cameraId: 137
  auto_find: true
  resolution:
    width: 1280
    height: 720
  fps: 30
  use_threading: true

vehicle_detector:
  model_path: "models/yolov8n.pt"
  confidence_threshold: 0.5 
  classes:
    - car
    - truck
    - bus
    - motorcycle
  
plate_detector:
  model_path: "models/license_plate_detector.pt"
  confidence_threshold: 0.3  
  min_plate_width: 40 
  min_plate_height: 20 
  detect_in_vehicles_only: true 


ssd_detector:
  model_path: "models/ssd_vehicle_detector.keras"
  weights_path: "models/ssd_best.weights.h5"
  confidence_threshold: 0.34
  nms_threshold: 0.2
  max_detections: 15
  min_box_size: 0.02

ocr:
  enabled: true
  engine: "easyocr"
  languages: ["en"]
  use_gpu: false
  confidence_threshold: 0.3
  min_text_length: 4
  ocr_frequency: 10
  cache_ttl: 30.0
  
  preprocessing:
    resize_height: 180
    resize_width: 320
    apply_clahe: true
    denoise: true 
  
  text_cleaning:
    remove_spaces: true
    uppercase: true
    allowed_chars: "BCDFGHJKLMNPRSTVWXYZ0123456789"
    apply_corrections: true

api:
  endpoint_base_url: "http://localhost:6903"
  car_plate_endpoint: "/ai/carPlate"
  timeout: 10
  max_retries: 3
  retry_delay: 2.0

display:
  window_name: "CRAI - Car Registration AI"
  enabled: true
  show_fps: true
  show_stats: true
  
  # Colores (BGR)
  colors:
    vehicle_box: [0, 255, 0]
    plate_box: [0, 255, 255]
    text_high_conf: [255, 255, 255]
    text_med_conf: [0, 255, 255]
    text_low_conf: [0, 165, 255] 
  
  font:
    vehicle_label: 0.6
    plate_label: 0.6
    stats: 0.6


performance:
  skip_frames: 1 
  max_fps: 30 
  resize_frame:
    enabled: false
    width: 640
    height: 360


logging:
  enabled: true
  level: "INFO"
  log_to_file: true
  log_to_console: true
  log_dir: "logs"
  max_file_size: 10485760
  backup_count: 5 
  
  modules:
    Config: "INFO"
    VehicleDetector: "INFO"
    PlateDetector: "INFO"
    PlateReader: "INFO"
    VideoStream: "INFO"
    main: "INFO"

alerts:
  enabled: false
  
  notifications:
    email: false
    webhook: false
    webhook_url: ""
  
  conditions:
    min_confidence: 0.7
    blacklist: []
    whitelist: []

tracking:
  enabled: false
  max_disappeared: 50
  max_distance: 50 
