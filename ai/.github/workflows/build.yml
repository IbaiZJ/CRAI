name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: ai/requirements.txt
      - name: Install AI Dependencies
        working-directory: ./ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run AI Tests with Coverage
        working-directory: ./ai
        run: |
          pytest tests/ -v --cov=src --cov-config=.coveragerc --cov-report=xml:coverage.xml --cov-report=term-missing
      - name: Debug coverage
        working-directory: ./ai
        run: |
          ls -la
          pwd
          head -n 10 coverage.xml
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          projectBaseDir: ai
          args: >
            -Dsonar.python.coverage.reportPaths=coverage.xml
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_AI }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
