[pytest]
# PyTest configuration file
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default options
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=api
    --cov-report=term-missing
    --cov-report=html

# Custom markers
markers =
    slow: test that runs slowly
    integration: integration tests
    unit: unit tests
    api: API related tests
