# SonarCloud project identification
sonar.projectKey=crai-ai
sonar.organization=crai123

# Info shown in SonarCloud
sonar.projectName=ai
sonar.projectVersion=1.0

# Code to analyze (paths relative to ai/)
sonar.sources=.
sonar.tests=tests

# Language and version
sonar.python.version=3.13

# Coverage report (pytest-cov generates relative paths from working directory)
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions
sonar.exclusions=**/tests/**,**/__pycache__/**,**/*_demo.py,**/logs/**,**/captures/**,**/models/**,**/notebooks/**
sonar.coverage.exclusions=**/*_demo.py,**/test_*.py,**/main.py,**/app_ui.py

# Encoding
sonar.sourceEncoding=UTF-8
