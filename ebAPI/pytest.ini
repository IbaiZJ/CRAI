[pytest]
# Pytest configuration for ebAPI
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage configuration
addopts = 
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=100
    -v
    --tb=short

# Coverage exclusions
[coverage:run]
branch = True
omit =

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    @app.on_event
    if TYPE_CHECKING: 
    tests/*
    */__pycache__/*
    */venv/*
    */env/*
    conftest.py


    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == "__main__":
    if __name__ == '__main__':
    if TYPE_CHECKING:
    @abstractmethod
    def def_handler
    signal.signal
