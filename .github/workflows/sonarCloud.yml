name: SonarCloud Analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  SONAR_HOST_URL: https://sonarcloud.io

jobs:
  ai-sonar:
    name: SonarCloud - ai
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: ai/requirements.txt
      - name: Install AI Dependencies
        working-directory: ./ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run AI Tests with Coverage
        working-directory: ./ai
        run: |
          pytest tests/ -v --cov=src --cov-config=.coveragerc --cov-report=xml:coverage.xml --cov-report=term-missing
      - name: SonarCloud Scan (ai)
        uses: SonarSource/sonarcloud-github-action@v2.3.0
        with:
          projectBaseDir: ai
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ebapi-sonar:
    name: SonarCloud - ebAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: ebAPI/requirements.txt
      - name: Install ebAPI Dependencies
        working-directory: ./ebAPI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run ebAPI Tests with Coverage
        working-directory: ./ebAPI
        run: |
          pytest tests/ -v --cov=. --cov-report=xml:coverage.xml --cov-report=term-missing
      - name: SonarCloud Scan (ebAPI)
        uses: SonarSource/sonarcloud-github-action@v2.3.0
        with:
          projectBaseDir: ebAPI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  itvapi-sonar:
    name: SonarCloud - itvAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: itvAPI/requirements.txt
      - name: Install itvAPI Dependencies
        working-directory: ./itvAPI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run itvAPI Tests with Coverage
        working-directory: ./itvAPI
        run: |
          pytest tests/ -v --cov=. --cov-report=xml:coverage.xml --cov-report=term-missing
      - name: SonarCloud Scan (itvAPI)
        uses: SonarSource/sonarcloud-github-action@v2.3.0
        with:
          projectBaseDir: itvAPI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  frontend-sonar:
    name: SonarCloud - frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci
      - name: Run Frontend Tests with Coverage
        working-directory: ./frontend
        run: npm run test:coverage -- --run
      - name: SonarCloud Scan (frontend)
        uses: SonarSource/sonarcloud-github-action@v2.3.0
        with:
          projectBaseDir: frontend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  os-sonar:
    name: SonarCloud - os
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build & Test os with Coverage
        working-directory: ./os
        run: mvn -B verify
      - name: SonarCloud Scan (os)
        uses: SonarSource/sonarcloud-github-action@v2.3.0
        with:
          projectBaseDir: os
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
