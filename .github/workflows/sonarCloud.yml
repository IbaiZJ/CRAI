name: SonarCloud Analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Job para ebAPI Backend
  ebapi-analysis:
    name: ebAPI Backend Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis

      # Configure Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: ebAPI/requirements.txt

      # Install Python Dependencies
      - name: Install ebAPI Dependencies
        working-directory: ./ebAPI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run tests and generate coverage report
      - name: Run ebAPI Tests with Coverage
        working-directory: ./ebAPI
        run: |
          pytest -v --cov --cov-report=xml --cov-report=term-missing
        continue-on-error: false

      # Upload coverage for SonarCloud
      - name: Upload ebAPI Coverage
        uses: actions/upload-artifact@v4
        with:
          name: ebapi-coverage
          path: ebAPI/coverage.xml
          retention-days: 7

  # Job para Frontend
  frontend-analysis:
    name: Frontend Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Configure Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Install Frontend Dependencies
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      # Run tests and generate coverage
      - name: Run Frontend Tests with Coverage
        working-directory: ./frontend
        run: npm run test:coverage -- --run

      # Upload coverage for SonarCloud
      - name: Upload Frontend Coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          retention-days: 7

  # Job para itvAPI
  itvapi-analysis:
    name: itvAPI Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Configure Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: itvAPI/requirements.txt

      # Install itvAPI Dependencies
      - name: Install itvAPI Dependencies
        working-directory: ./itvAPI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run tests and generate coverage report
      - name: Run itvAPI Tests with Coverage
        working-directory: ./itvAPI
        run: |
          pytest -v --cov --cov-report=xml --cov-report=term-missing
        continue-on-error: false

      # Upload coverage for SonarCloud
      - name: Upload itvAPI Coverage
        uses: actions/upload-artifact@v4
        with:
          name: itvapi-coverage
          path: itvAPI/coverage.xml
          retention-days: 7

  # Job para SonarCloud Analysis - restored to import coverage artifacts
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs: [ebapi-analysis, frontend-analysis, itvapi-analysis]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Download coverage reports
      - name: Download ebAPI Coverage
        uses: actions/download-artifact@v4
        with:
          name: ebapi-coverage
          path: ebAPI/

      - name: Download Frontend Coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

      - name: Download itvAPI Coverage
        uses: actions/download-artifact@v4
        with:
          name: itvapi-coverage
          path: itvAPI/

      # SonarCloud Scan (imports coverage reports)
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  # Note: Ensure Automatic Analysis is disabled in SonarCloud for this project
  # before running CI-based SonarScanner; otherwise the scan will be rejected.
