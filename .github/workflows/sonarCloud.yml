name: SonarCloud Analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Job para Python/Backend
  python-analysis:
    name: Python Backend Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis

      # Configure Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: ai/requirements.txt

      # Install Python Dependencies
      - name: Install Python Dependencies
        working-directory: ./ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run tests and generate coverage report
      - name: Run Python Tests with Coverage
        working-directory: ./ai
        run: |
          pytest -v --cov=api --cov-report=xml --cov-report=term-missing
        continue-on-error: false

      # SonarCloud Scan for Python
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.sources=ai/api
            -Dsonar.tests=ai/tests
            -Dsonar.python.coverage.reportPaths=ai/coverage.xml
            -Dsonar.python.version=3.13
            -Dsonar.sourceEncoding=UTF-8

