name: SonarCloud Analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Job para ebAPI Backend
  ebapi-analysis:
    name: ebAPI Backend Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis

      # Configure Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: ebAPI/requirements.txt

      # Install Python Dependencies
      - name: Install ebAPI Dependencies
        working-directory: ./ebAPI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run tests and generate coverage report
      - name: Run ebAPI Tests with Coverage
        working-directory: ./ebAPI
        run: |
          pytest -v --cov --cov-report=xml --cov-report=term-missing
        continue-on-error: false

      # Upload coverage for SonarCloud
      - name: Upload ebAPI Coverage
        uses: actions/upload-artifact@v4
        with:
          name: ebapi-coverage
          path: ebAPI/coverage.xml
          retention-days: 7

  # Job para Frontend
  frontend-analysis:
    name: Frontend Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Configure Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Install Frontend Dependencies
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      # Run tests and generate coverage
      - name: Run Frontend Tests with Coverage
        working-directory: ./frontend
        run: npm run test:coverage -- --run

      # Upload coverage for SonarCloud
      - name: Upload Frontend Coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          retention-days: 7

  # Job para SonarCloud Analysis
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs: [ebapi-analysis, frontend-analysis]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Download coverage reports
      - name: Download ebAPI Coverage
        uses: actions/download-artifact@v4
        with:
          name: ebapi-coverage
          path: ebAPI/

      - name: Download Frontend Coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/

        # Validate SonarCloud project and default branch before scanning
      - name: Validate SonarCloud project exists
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
        run: |
          echo "Checking SonarCloud project '$SONAR_PROJECT_KEY'"
          resp=$(curl -s -u "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/projects/search?organization=$SONAR_ORGANIZATION&projects=$SONAR_PROJECT_KEY")

          if ! echo "$resp" | grep -q "\"key\":\"$SONAR_PROJECT_KEY\""; then
            echo "ERROR: SonarCloud project '$SONAR_PROJECT_KEY' not found in organization '$SONAR_ORGANIZATION'."
            echo "Response: $resp"
            exit 1
          fi


      - name: Validate SonarCloud default branch
        run: |
          resp=$(curl -s -u "${{ secrets.SONAR_TOKEN }}:" "https://sonarcloud.io/api/project_branches/list?project=${{ secrets.SONAR_PROJECT_KEY }}")
          if ! echo "$resp" | grep -q '"default":true'; then
            echo "ERROR: No default branch found for project '${{ secrets.SONAR_PROJECT_KEY }}'. Ensure project has a default branch (e.g. 'main') and is bound to the repository."
            echo "Response: $resp"
            exit 1
          fi

      # SonarCloud Scan
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
            -Dsonar.projectKey=IbaiZJ_CRAI
            -Dsonar.organization=crai123
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
