name: SonarCloud Analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  SONAR_HOST_URL: https://sonarcloud.io

jobs:
  ai-sonar:
    name: SonarCloud - ai
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: ai/requirements.txt
      - name: Install AI Dependencies
        working-directory: ./ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run AI Tests with Coverage
        working-directory: ./ai
        run: |
          # Run all tests with coverage on src/ and scripts/
          pytest tests/ -v \
            --ignore=tests/test_scripts.py \
            --ignore=tests/test_diagnose_extended.py \
            --ignore=tests/test_ssd_load_script.py \
            --ignore=tests/test_full_src_coverage.py \
            --cov=src --cov=scripts \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=0 || true
      - name: Fix Coverage Paths for SonarCloud
        working-directory: ./ai
        run: |
          # Fix the source path in coverage.xml to be relative
          # First replace absolute paths with relative ones
          sed -i 's|<source>.*ai/src</source>|<source>src</source>|g' coverage.xml
          sed -i 's|<source>.*ai/scripts</source>|<source>scripts</source>|g' coverage.xml
          # Fix individual file paths for src/: change "api/file.py" to "src/api/file.py"
          sed -i 's|filename="api/|filename="src/api/|g' coverage.xml
          sed -i 's|filename="config/|filename="src/config/|g' coverage.xml
          sed -i 's|filename="detectors/|filename="src/detectors/|g' coverage.xml
          sed -i 's|filename="utils/|filename="src/utils/|g' coverage.xml
          sed -i 's|filename="video/|filename="src/video/|g' coverage.xml
          # Fix script files: change "train_ssd.py" to "scripts/train_ssd.py"
          sed -i 's|filename="train_ssd.py"|filename="scripts/train_ssd.py"|g' coverage.xml
          echo "=== Fixed coverage.xml sources ==="
          grep -E "<source>|filename=" coverage.xml | head -30
      - name: Debug AI Coverage
        working-directory: ./ai
        continue-on-error: true
        run: |
          echo "=== Coverage file ==="
          ls -la coverage.xml || echo "No coverage.xml"
          echo "=== First 20 lines ==="
          head -n 20 coverage.xml || echo "Cannot read"
      - name: SonarCloud Scan (ai)
        uses: SonarSource/sonarcloud-github-action@v2.3.0
        with:
          projectBaseDir: ai
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ebapi-sonar:
    name: SonarCloud - ebAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: ebAPI/requirements.txt
      - name: Install ebAPI Dependencies
        working-directory: ./ebAPI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run ebAPI Tests with Coverage
        working-directory: ./ebAPI
        run: |
          pytest tests/ -v --cov=. --cov-report=xml:coverage.xml --cov-report=term-missing
      - name: SonarCloud Scan (ebAPI)
        uses: SonarSource/sonarcloud-github-action@v2.3.0
        with:
          projectBaseDir: ebAPI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  itvapi-sonar:
    name: SonarCloud - itvAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: itvAPI/requirements.txt
      - name: Install itvAPI Dependencies
        working-directory: ./itvAPI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run itvAPI Tests with Coverage
        working-directory: ./itvAPI
        run: |
          pytest tests/ -v --cov=. --cov-report=xml:coverage.xml --cov-report=term-missing
      - name: SonarCloud Scan (itvAPI)
        uses: SonarSource/sonarcloud-github-action@v2.3.0
        with:
          projectBaseDir: itvAPI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  frontend-sonar:
    name: SonarCloud - frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install --legacy-peer-deps
      - name: Run Frontend Tests with Coverage
        working-directory: ./frontend
        run: npm run test:coverage -- --run
      - name: SonarCloud Scan (frontend)
        uses: SonarSource/sonarcloud-github-action@v2.3.0
        with:
          projectBaseDir: frontend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  os-sonar:
    name: SonarCloud - os
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build & Test os with Coverage
        working-directory: ./os
        run: mvn -B verify
      - name: SonarCloud Scan (os)
        uses: SonarSource/sonarcloud-github-action@v2.3.0
        with:
          projectBaseDir: os
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
