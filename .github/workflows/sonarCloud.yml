name: SonarCloud Analysis

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  SONAR_HOST_URL: https://sonarcloud.io

jobs:
  # Job para ebAPI Backend
  ebapi-analysis:
    name: ebAPI Backend Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis

      # Configure Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: ebAPI/requirements.txt

      # Install Python Dependencies
      - name: Install ebAPI Dependencies
        working-directory: ./ebAPI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run tests and generate coverage report
      - name: Run ebAPI Tests with Coverage
        working-directory: ./ebAPI
        run: |
          pytest -v --cov --cov-report=xml --cov-report=term-missing
        continue-on-error: false

      # Upload coverage for SonarCloud
      - name: Upload ebAPI Coverage
        uses: actions/upload-artifact@v4
        with:
          name: ebapi-coverage
          path: ebAPI/coverage.xml
          retention-days: 7

  # Job para Frontend
  frontend-analysis:
    name: Frontend Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Configure Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      # Install Frontend Dependencies
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      # Run tests and generate coverage
      - name: Run Frontend Tests with Coverage
        working-directory: ./frontend
        run: npm run test:coverage -- --run

      # Upload coverage for SonarCloud
      - name: Upload Frontend Coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          retention-days: 7

  # Job para itvAPI
  itvapi-analysis:
    name: itvAPI Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Configure Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: itvAPI/requirements.txt

      # Install itvAPI Dependencies
      - name: Install itvAPI Dependencies
        working-directory: ./itvAPI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Run tests and generate coverage report
      - name: Run itvAPI Tests with Coverage
        working-directory: ./itvAPI
        run: |
          pytest -v --cov --cov-report=xml --cov-report=term-missing
        continue-on-error: false

      # Upload coverage for SonarCloud
      - name: Upload itvAPI Coverage
        uses: actions/upload-artifact@v4
        with:
          name: itvapi-coverage
          path: itvAPI/coverage.xml
          retention-days: 7

  # Job para SonarCloud Scan
  sonarcloud-scan:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs:
      - ebapi-analysis
      - frontend-analysis
      - itvapi-analysis
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download ebAPI Coverage
        uses: actions/download-artifact@v4
        with:
          name: ebapi-coverage
          path: ebAPI

      - name: Download Frontend Coverage
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage

      - name: Download itvAPI Coverage
        uses: actions/download-artifact@v4
        with:
          name: itvapi-coverage
          path: itvAPI

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2.3.0
        with:
          args: >
            -Dsonar.organization=${{ env.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
            -Dsonar.host.url=${{ env.SONAR_HOST_URL }}
            -Dsonar.python.coverage.reportPaths=ebAPI/coverage.xml
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
