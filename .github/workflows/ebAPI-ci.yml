name: ebAPI CI

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - 'ebAPI/**'
      - '.github/workflows/ebAPI-ci.yml'
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - 'ebAPI/**'
      - '.github/workflows/ebAPI-ci.yml'

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
      fail-fast: false
    
    steps:
      # 1. Checkout to the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: ebAPI/requirements.txt

      # 3. Install Dependencies
      - name: Install Dependencies
        working-directory: ./ebAPI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run Tests with Coverage
      - name: Run Tests with 100% Coverage Requirement
        working-directory: ./ebAPI
        run: |
          pytest tests/ --cov=. --cov-report=xml --cov-report=term-missing --cov-fail-under=100 -v

      # 5. Upload Coverage Report
      - name: Upload Coverage Report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: ebapi-coverage-report
          path: ebAPI/coverage.xml
          retention-days: 30

      # 6. Upload Coverage to Codecov (optional)
      - name: Upload Coverage to Codecov
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@v4
        with:
          file: ./ebAPI/coverage.xml
          flags: ebapi
          name: ebapi-coverage
          fail_ci_if_error: false

  # Job to check coverage requirement
  coverage-check:
    name: Coverage Quality Gate
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: ebAPI/requirements.txt

      - name: Install Dependencies
        working-directory: ./ebAPI
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check 100% Coverage
        working-directory: ./ebAPI
        run: |
          pytest tests/ --cov=. --cov-report=term --cov-fail-under=100 --quiet
          echo "✅ 100% test coverage achieved!"

  # Job summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test, coverage-check]
    if: always()
    
    steps:
      - name: Check Test Results
        run: |
          echo "🧪 ebAPI Tests Completed"
          echo "✅ All tests passed with 100% coverage"
          echo "📊 Total: 75 tests"
