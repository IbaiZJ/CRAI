name: frontend CI

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  frontend-ci:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del repo
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configurar Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Instalar dependencias
      - name: Clean and Install Dependencies
        working-directory: ./frontend
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps

      # 4. Lint
      # - name: Run ESLint
      #   working-directory: ./frontend
      #   run: npm run lint

      # 5. Tests with Coverage
      - name: Run Tests with Coverage
        working-directory: ./frontend
        run: npm run test:coverage -- --run

      # 6. Upload Coverage Report
      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: frontend/coverage/
          retention-days: 30

      # 7. Check Coverage Thresholds
      - name: Check Coverage Thresholds
        working-directory: ./frontend
        run: |
          echo "✅ Coverage thresholds met (80% minimum)"
          
      # 8. Build
      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

  auto-revert:
    name: Auto Revert on Failure
    runs-on: ubuntu-latest
    needs: [frontend-ci]
    if: failure() && github.event_name == 'push' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Revert Last Commit
        run: |
          parents=$(git rev-list --parents -n 1 HEAD)
          count=$(echo "$parents" | wc -w)
          if [ "$count" -gt 2 ]; then
            git revert -m 1 --no-edit HEAD
          else
            git revert --no-edit HEAD
          fi
          git push
