name: Frontend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  frontend-ci:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del repo
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Configurar Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 3. Instalar dependencias
      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      # 4. Lint
      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint

      # 5. Tests
      - name: Run Tests
        working-directory: ./frontend
        run: npm run test -- --run

      # 6. Build
      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build
