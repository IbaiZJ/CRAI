name: AI Backend Tests

on:
  push:
    branches: [ "main" ]
    paths:
      - 'ai/**'
      - '.github/workflows/ai-backend-tests.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'ai/**'
      - '.github/workflows/ai-backend-tests.yml'

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.13']
      fail-fast: false
    
    steps:
      # 1. Checkout to the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: ai/requirements.txt

      # 3. Install Dependencies
      - name: Install Dependencies
        working-directory: ./ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run Tests
      - name: Run Tests
        working-directory: ./ai
        run: |
          pytest -v --cov=api --cov-report=xml --cov-report=term-missing

      # 5. Save Coverage Report
      - name: Upload Coverage Report
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ai/coverage.xml
          retention-days: 30

  # Job to check minimum coverage
  coverage-check:
    name: Coverage Check
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: ai/requirements.txt

      - name: Install Dependencies
        working-directory: ./ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Coverage Check
        working-directory: ./ai
        run: |
          pytest --cov=api --cov-report=term --cov-fail-under=80
