name: os CI

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - "os/**"
      - ".github/workflows/os-ci.yml"

jobs:
  test:
    name: Test (Java 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build & test
        working-directory: ./os
        run: mvn -B verify

  auto-revert:
    name: Auto Revert on Failure
    runs-on: ubuntu-latest
    needs: [test]
    if: failure() && github.event_name == 'push' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Revert Last Commit
        run: |
          parents=$(git rev-list --parents -n 1 HEAD)
          count=$(echo "$parents" | wc -w)
          if [ "$count" -gt 2 ]; then
            git revert -m 1 --no-edit HEAD
          else
            git revert --no-edit HEAD
          fi
          git push
