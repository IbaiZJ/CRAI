name: os CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "os/**"
      - ".github/workflows/os-ci.yml"

jobs:
  test:
    name: Test (Java 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build & test
        working-directory: ./os
        run: mvn -B verify
