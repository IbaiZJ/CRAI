services:
  # MySQL database
  # mysql:
  #   image: mysql:8.0
  #   container_name: mysql_db
  #   restart: unless-stopped
  #   environment:
  #     MYSQL_ROOT_PASSWORD: root
  #     MYSQL_DATABASE: CRAI_DB
  #     MYSQL_USER: user
  #     MYSQL_PASSWORD: password
  #   ports:
  #     - "6900:3306"
  #   volumes:
  #     - mysql_data:/var/lib/mysql
  #   networks:
  #     - app-network

  # Frontend service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_app
    ports:
      - "6901:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - node-red
    networks:
      - app-network

  # AI service
  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: ai_service
    volumes:
      - ./ai:/app
    ports:
      - "6902:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - ENV=local
    networks:
      - app-network
    restart: unless-stopped

  # Node-RED service
  node-red:
    image: nodered/node-red:latest
    container_name: node_red_service
    ports:
      - "6903:1880"
    volumes:
      - node_red_data:/data
    environment:
      - TZ=Europe/Madrid
    depends_on:
      - ebapi
    networks:
      - app-network
    restart: unless-stopped

  # Environmental Badge API service
  ebapi:
    build:
      context: ./ebAPI
      dockerfile: Dockerfile
    container_name: ebapi_service
    ports:
      - "6904:8000"
    volumes:
      - ./ebAPI:/app
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - app-network
    restart: unless-stopped

  # Documentation service
  docs:
    build:
      context: ./docs
      dockerfile: Dockerfile
    container_name: docs_service
    ports:
      - "6910:4321"
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  node_red_data:
    driver: local

