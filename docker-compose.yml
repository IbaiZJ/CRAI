services:
  # MySQL database
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: CRAI_DB
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "6900:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

  # Frontend service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_app
    ports:
      - "6901:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - app-network

  # AI service
  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    container_name: ai_service
    volumes:
      - ./ai:/app
    ports:
      - "6902:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - ENV=local
    depends_on:
      - mysql
    networks:
      - app-network
    restart: unless-stopped

  # Documentation service
  docs:
    build:
      context: ./docs
      dockerfile: Dockerfile
    container_name: docs_service
    ports:
      - "6910:4321"
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local

