[pytest]
# Pytest configuration for ebAPI
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage configuration
addopts = 
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=100
    -v
    --tb=short

# Coverage exclusions
[coverage:run]
omit = 
    tests/*
    */__pycache__/*
    */venv/*
    */env/*
    conftest.py
    util/script_generation_itv_date.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == "__main__":
    if __name__ == '__main__':
    if TYPE_CHECKING:
    @abstractmethod
    def def_handler
    signal.signal
