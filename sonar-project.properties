# SonarCloud Configuration
sonar.projectKey=${SONAR_PROJECT_KEY}
sonar.organization=${SONAR_ORGANIZATION}

# Project Information
sonar.projectName=CRAI - ANPR System
sonar.projectVersion=1.0

# Source Code
sonar.sources=ai/api
sonar.tests=ai/tests

# Language
sonar.language=py
sonar.python.version=3.13

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/__pycache__/**,**/htmlcov/**,.pytest_cache/**,**/migrations/**

# Test Exclusions
sonar.test.exclusions=**/tests/**,**/test_*.py,**/*_test.py

# Coverage
sonar.python.coverage.reportPaths=ai/coverage.xml
sonar.coverage.exclusions=**/tests/**,**/test_*.py,**/*_test.py,**/conftest.py

# Source Encoding
sonar.sourceEncoding=UTF-8

# Additional Settings
sonar.scm.provider=git
