# SonarCloud Configuration
# Use environment variables for SonarCloud credentials when running locally
# These values are read from the environment (for example via a .env file)
sonar.host.url=${env.SONAR_HOST_URL}
sonar.login=${env.SONAR_TOKEN}
sonar.projectKey=${env.SONAR_PROJECT_KEY}
sonar.organization=${env.SONAR_ORGANIZATION}

# Project Information
sonar.projectName=CRAI - Environmental Badge & ANPR System
sonar.projectVersion=1.0

# Source Code - All modules relative to repo root
sonar.sources=ebAPI,itvAPI,ai/src/video,frontend/src,os/src/main/java
sonar.tests=ebAPI/tests,itvAPI/tests,ai/tests,frontend/src/test,os/src/test/java

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/__pycache__/**,**/htmlcov/**,.pytest_cache/**,**/migrations/**,**/coverage/**,**/*.test.ts,**/*.test.tsx,**/test/**,**/database/**,**/_*_demo.py,**/script_generation*.py

# Test Exclusions
sonar.test.exclusions=**/tests/**,**/test_*.py,**/*_test.py,**/*.test.ts,**/*.test.tsx

# Coverage Reports - relative paths from repo root
sonar.python.coverage.reportPaths=ebAPI/coverage.xml,itvAPI/coverage.xml,ai/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.coverage.jacoco.xmlReportPaths=os/target/site/jacoco/jacoco.xml

# Coverage Exclusions
sonar.coverage.exclusions=**/tests/**,**/test_*.py,**/*_test.py,**/conftest.py,**/*.test.ts,**/*.test.tsx,**/test/**,**/_*_demo.py,**/script_generation*.py,**/ebAPI/util/optimize_dataset.py,**/ebAPI/util/get_badge_types.py

# Languages
sonar.python.version=3.13
sonar.java.binaries=os/target/classes

# Source Encoding
sonar.sourceEncoding=UTF-8

# Additional Settings
sonar.scm.provider=git
