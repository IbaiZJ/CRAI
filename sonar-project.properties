# SonarCloud Configuration
#sonar.projectKey=${SONAR_PROJECT_KEY}
#sonar.organization=${SONAR_ORGANIZATION}
    
# Project Information
sonar.projectName=CRAI - Environmental Badge & ANPR System
sonar.projectVersion=1.0

# Source Code
sonar.sources=ebAPI,frontend/src
sonar.tests=ebAPI/tests,frontend/src/test

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/__pycache__/**,**/htmlcov/**,.pytest_cache/**,**/migrations/**,**/coverage/**,**/*.test.ts,**/*.test.tsx,**/test/**,**/database/**

# Test Exclusions
sonar.test.exclusions=**/tests/**,**/test_*.py,**/*_test.py,**/*.test.ts,**/*.test.tsx

# Coverage
sonar.python.coverage.reportPaths=ebAPI/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.coverage.exclusions=**/tests/**,**/test_*.py,**/*_test.py,**/conftest.py,**/*.test.ts,**/*.test.tsx,**/test/**

# Languages
sonar.python.version=3.13

# Source Encoding
sonar.sourceEncoding=UTF-8

# Additional Settings
sonar.scm.provider=git
