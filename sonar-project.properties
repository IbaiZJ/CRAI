# SonarCloud Configuration
# Use environment variables for SonarCloud credentials when running locally
# These values are read from the environment (for example via a .env file)
sonar.host.url=${env.SONAR_HOST_URL}
sonar.login=${env.SONAR_TOKEN}
sonar.projectKey=${env.SONAR_PROJECT_KEY}
sonar.organization=${env.SONAR_ORGANIZATION}

# Project Information
sonar.projectName=CRAI - Environmental Badge & ANPR System
sonar.projectVersion=1.0

# Source Code
sonar.sources=ebAPI,itvAPI,frontend/src,os/src/main/java
sonar.tests=ebAPI/tests,itvAPI/tests,frontend/src/test,os/src/test/java

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/__pycache__/**,**/htmlcov/**,.pytest_cache/**,**/migrations/**,**/coverage/**,**/*.test.ts,**/*.test.tsx

# Test Exclusions
sonar.test.exclusions=**/test_*.py,**/*_test.py,**/*.test.ts,**/*.test.tsx

# Coverage
sonar.python.coverage.reportPaths=ebAPI/coverage.xml,itvAPI/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.coverage.jacoco.xmlReportPaths=os/target/site/jacoco/jacoco.xml
sonar.coverage.exclusions=**/tests/**,**/conftest.py,**/*.test.ts,**/*.test.tsx

# Languages
sonar.python.version=3.13
sonar.java.binaries=os/target/classes

# Source Encoding
sonar.sourceEncoding=UTF-8

# SCM
sonar.scm.provider=git
